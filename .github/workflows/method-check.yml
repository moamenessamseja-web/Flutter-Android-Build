# Reusable workflow: enforce the .agent/ method mechanically on a Pull Request.
# Call it from any repository:
#   uses: moamenessamseja-web/Flutter-Android-Build/.github/workflows/method-check.yml@main
# Fails on ERROR (missing memory files, secrets, invalid statuses, handoff docs not updated in the PR).
# Warnings are reported, not fatal.
name: Method check

on:
  workflow_call:
    inputs:
      gateway_ref:
        description: "Gateway ref to fetch the audit script from. Pin it to the same ref you call this workflow with."
        required: false
        type: string
        default: "main"
      fail_on_warning:
        description: "Treat audit warnings as errors too."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Agent memory audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch gateway audit script
        env:
          GATEWAY_REF: ${{ inputs.gateway_ref }}
        run: |
          base="https://raw.githubusercontent.com/moamenessamseja-web/Flutter-Android-Build/$GATEWAY_REF"
          mkdir -p "$RUNNER_TEMP/gw"
          curl -fsSL "$base/.skills/engineer-in-charge/scripts/agent_audit.py" -o "$RUNNER_TEMP/gw/agent_audit.py"

      - name: Run audit
        env:
          FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/gw/agent_audit.py" --repo . > "$RUNNER_TEMP/audit.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### Agent memory audit"
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            case "$line" in
              ERROR:*) echo "::error title=Agent memory::$line" ;;
              WARN:*)  echo "::warning title=Agent memory::$line" ;;
            esac
          done < "$RUNNER_TEMP/audit.txt"
          if [ "$code" -ne 0 ]; then exit 1; fi
          if [ "$FAIL_ON_WARNING" = "true" ] && grep -q '^WARN:' "$RUNNER_TEMP/audit.txt"; then exit 1; fi

      - name: Memory docs changed in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then echo "Not a pull_request event - skipping."; exit 0; fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          missing=""
          for f in IMPLEMENTATION_STATE.md HANDOFF.md CHANGELOG.md; do
            echo "$changed" | grep -qx ".agent/$f" || missing="$missing .agent/$f"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Handoff incomplete::not updated in this PR:$missing"
            exit 1
          fi
          echo "All three handoff docs updated in this PR."
