# Proves the reusable workflow works end to end by building fixtures/smoke_app
# (a minimal Flutter app WITHOUT an android/ folder, so the scaffold path is exercised too).
name: Smoke test (reusable workflow)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "fixtures/**"

permissions:
  contents: read

jobs:
  pinned:
    name: Pinned toolchain (must pass)
    uses: ./.github/workflows/flutter-android-build.yml
    with:
      working_directory: fixtures/smoke_app
      flutter_version: "3.47.9"
      build_mode: debug
      artifact_name: smoke-apk-pinned
      artifact_retention_days: 1
