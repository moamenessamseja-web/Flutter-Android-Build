# Reusable workflow: generate and commit pubspec.lock on a NON-main branch.
# Safety: permissions contents:write is scoped to this workflow; it writes only pubspec.lock,
# only on the dispatched branch, and refuses main. GITHUB_TOKEN pushes do not trigger workflows,
# so there is no CI loop. See .agent/ACCESS.md.
name: Lockfile (commit pubspec.lock)

on:
  workflow_call:
    inputs:
      flutter_version:
        description: "Exact Flutter version. Pin it to the same version as build-apk.yml."
        required: false
        type: string
        default: ""
      flutter_channel:
        description: "Flutter channel."
        required: false
        type: string
        default: "stable"
      working_directory:
        description: "Directory containing pubspec.yaml, relative to the repository root."
        required: false
        type: string
        default: "."

permissions:
  contents: write

jobs:
  lockfile:
    name: Commit pubspec.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Refuse main
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::lockfile workflow refuses to run on main; dispatch it on a feature branch"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
          pub-cache: true
      - name: Generate lockfile
        run: flutter pub get
      - name: Commit pubspec.lock if changed
        working-directory: ${{ github.workspace }}
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WORK_DIR/pubspec.lock"
          if git diff --cached --quiet; then
            echo "pubspec.lock unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(ci): commit pubspec.lock"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "::notice title=Lockfile committed::branch=$GITHUB_REF_NAME path=$WORK_DIR/pubspec.lock commit=$(git rev-parse HEAD)"
