# Reusable workflow: build a Flutter Android APK.
# Call it from any repository with `uses: <owner>/Flutter-Android-Build/.github/workflows/flutter-android-build.yml@main`.
# Docs: README.md (section "Connect another Flutter repository").
name: Flutter Android Build

on:
  workflow_call:
    inputs:
      flutter_version:
        description: "Exact Flutter version (e.g. 3.47.9). Empty = latest release of the channel. Pin it for reproducible builds."
        required: false
        type: string
        default: ""
      flutter_channel:
        description: "Flutter channel: stable, beta or main."
        required: false
        type: string
        default: "stable"
      java_version:
        description: "JDK version used by Gradle (Temurin)."
        required: false
        type: string
        default: "17"
      build_mode:
        description: "release, debug or profile."
        required: false
        type: string
        default: "release"
      working_directory:
        description: "Directory containing pubspec.yaml, relative to the repository root."
        required: false
        type: string
        default: "."
      android_scaffold:
        description: "auto = run `flutter create --platforms=android` only when android/ is missing; never = fail if it is missing."
        required: false
        type: string
        default: "auto"
      scaffold_args:
        description: "Extra arguments for `flutter create` when the scaffold is generated (e.g. --org com.example)."
        required: false
        type: string
        default: ""
      pre_build_command:
        description: "Optional shell command run after `pub get` and scaffold, before analyze/test/build (e.g. bash tool/ci_inject_android.sh)."
        required: false
        type: string
        default: ""
      run_analyze:
        description: "Run `flutter analyze` before building."
        required: false
        type: boolean
        default: true
      analyze_args:
        description: "Arguments for `flutter analyze`. Warnings and errors fail the build; infos do not."
        required: false
        type: string
        default: "--no-fatal-infos"
      run_tests:
        description: "Run `flutter test` before building (skipped automatically when there is no test/ directory)."
        required: false
        type: boolean
        default: true
      build_args:
        description: "Extra arguments for `flutter build apk` (e.g. --build-number=42 --dart-define=ENV=prod)."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded APK artifact."
        required: false
        type: string
        default: "android-apk"
      artifact_retention_days:
        description: "Days to keep the APK artifact (1-90)."
        required: false
        type: number
        default: 14
      fixed_debug_keystore:
        description: "Sign debug-signed builds (debug mode, and release mode while the app has no release signing) with one fixed shared debug keystore, so every APK has the same signature and updates install over each other. Not a secret and not for publishing."
        required: false
        type: boolean
        default: true
      gradle_cache_read_only:
        description: "true = never write the Gradle cache (setup-gradle defaults to read-only on non-default branches; this workflow defaults to false so feature branches also warm the cache)."
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 30
    outputs:
      artifact_name:
        description: "Name of the uploaded APK artifact."
        value: ${{ jobs.build.outputs.artifact_name }}
      flutter_version:
        description: "Flutter version actually used."
        value: ${{ jobs.build.outputs.flutter_version }}
      signer_sha256:
        description: "SHA-256 fingerprint of the certificate that signed the APK (same value across builds = installable as an update)."
        value: ${{ jobs.build.outputs.signer_sha256 }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ inputs.artifact_name }}
      flutter_version: ${{ steps.fingerprint.outputs.flutter_version }}
      signer_sha256: ${{ steps.apk.outputs.signer_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Validate inputs
        working-directory: ${{ github.workspace }}  # the project directory does not exist before checkout
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          ANDROID_SCAFFOLD: ${{ inputs.android_scaffold }}
        run: |
          case "$BUILD_MODE" in release|debug|profile) ;; *) echo "::error::build_mode must be release, debug or profile (got '$BUILD_MODE')"; exit 1;; esac
          case "$ANDROID_SCAFFOLD" in auto|never) ;; *) echo "::error::android_scaffold must be auto or never (got '$ANDROID_SCAFFOLD')"; exit 1;; esac
          # Log directory for failure diagnostics (uploaded only when the job fails).
          echo "LOG_DIR=$RUNNER_TEMP/ci-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ci-logs"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check pubspec.yaml exists
        run: |
          test -f pubspec.yaml || { echo "::error::No pubspec.yaml in '${{ inputs.working_directory }}'. Set the working_directory input."; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Flutter (SDK + pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ inputs.gradle_cache_read_only }}

      - name: Toolchain fingerprint
        id: fingerprint
        run: |
          flutter --version --machine > "$LOG_DIR/flutter-version.json"
          FV=$(jq -r .frameworkVersion "$LOG_DIR/flutter-version.json")
          echo "flutter_version=$FV" >> "$GITHUB_OUTPUT"
          {
            echo "### Toolchain"
            echo '```'
            flutter --version
            java -version 2>&1 | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee "$LOG_DIR/pub-get.log"
        # bash is invoked with -eo pipefail by GitHub when `shell: bash` is set, so a failing pub get fails the step.

      - name: Generate Android scaffold if missing
        env:
          ANDROID_SCAFFOLD: ${{ inputs.android_scaffold }}
          SCAFFOLD_ARGS: ${{ inputs.scaffold_args }}
        run: |
          if [ -d android ]; then echo "android/ already present - nothing to generate."; exit 0; fi
          if [ "$ANDROID_SCAFFOLD" = "never" ]; then
            echo "::error::android/ is missing and android_scaffold=never."; exit 1
          fi
          # `flutter create` writes an analysis_options.yaml that includes package:flutter_lints, which the app
          # may not depend on (analyze would then fail with include_file_not_found). Keep the app's own analyzer
          # configuration: if it had none, drop the generated one.
          had_analysis_options=false
          [ -f analysis_options.yaml ] && had_analysis_options=true
          # flutter create derives the project name from the directory name; the checkout directory is the
          # repository name, which may not be a valid Dart package name (e.g. my-app). Use the pubspec name.
          proj=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\"' \r")
          # shellcheck disable=SC2086  # intentional word splitting of extra args
          flutter create --platforms=android --project-name "$proj" $SCAFFOLD_ARGS . 2>&1 | tee "$LOG_DIR/flutter-create.log"
          if [ "$had_analysis_options" = false ]; then rm -f analysis_options.yaml; fi

      - name: Pre-build command
        if: ${{ inputs.pre_build_command != '' }}
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -eo pipefail -c "$PRE_BUILD_COMMAND" 2>&1 | tee "$LOG_DIR/pre-build.log"

      - name: Analyze
        id: analyze
        if: ${{ inputs.run_analyze }}
        env:
          ANALYZE_ARGS: ${{ inputs.analyze_args }}
        run: |
          # shellcheck disable=SC2086
          flutter analyze $ANALYZE_ARGS 2>&1 | tee "$LOG_DIR/analyze.log"
          echo "analyze=ran" >> "$GITHUB_OUTPUT"

      - name: Test
        id: test
        if: ${{ inputs.run_tests }}
        run: |
          if [ ! -d test ]; then
            echo "tests=skipped-no-test-dir" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tests skipped::No test/ directory - this build ran ZERO tests. A green build does not mean the app was tested."
            echo "- ⚠️ **Tests: SKIPPED** (no \`test/\` directory)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flutter test 2>&1 | tee "$LOG_DIR/test.log"
          echo "tests=ran" >> "$GITHUB_OUTPUT"

      - name: Install fixed debug keystore
        if: ${{ inputs.fixed_debug_keystore }}
        working-directory: ${{ github.workspace }}
        run: |
          # Public, shared debug key (alias androiddebugkey, password android). Without it every CI run
          # generates a new random debug key, so Android refuses to install a build over the previous one.
          # Gradle ignores ~/.android/debug.keystore on these runners (measured), so the key is injected
          # explicitly through AGP's android.injected.signing.* properties, which apply to every variant.
          ks="$RUNNER_TEMP/fixed-debug.keystore"
          echo '' | base64 -d > "$ks"
          gh_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gh_home"
          {
            echo "android.injected.signing.store.file=$ks"
            echo "android.injected.signing.store.password=android"
            echo "android.injected.signing.key.alias=androiddebugkey"
            echo "android.injected.signing.key.password=android"
          } >> "$gh_home/gradle.properties"

      - name: Build APK
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          # shellcheck disable=SC2086
          flutter build apk "--$BUILD_MODE" $BUILD_ARGS 2>&1 | tee "$LOG_DIR/build.log"

      - name: Report APK details
        id: apk
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FIXED_DEBUG_KEYSTORE: ${{ inputs.fixed_debug_keystore }}
          ANALYZE_STATUS: ${{ steps.analyze.outputs.analyze || 'disabled' }}
          TESTS_STATUS: ${{ steps.test.outputs.tests || 'disabled' }}
        run: |
          apk=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' | sort | head -n 1)
          [ -n "$apk" ] || { echo "::error::No APK found after build"; exit 1; }
          size=$(du -h "$apk" | cut -f1)
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          signer="unavailable"
          apksigner=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$apksigner" ]; then
            signer=$("$apksigner" verify --print-certs "$apk" 2>/dev/null | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
            [ -n "$signer" ] || signer="unavailable"
          fi
          echo "signer_sha256=$signer" >> "$GITHUB_OUTPUT"
          pkg="unavailable"
          aapt2=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$aapt2" ]; then pkg=$("$aapt2" dump packagename "$apk" 2>/dev/null || true); [ -n "$pkg" ] || pkg="unavailable"; fi
          expected="136966601854d1bd1397841d7d5ef10f1145bd8ac71c49f8ac6812857f136233"
          if [ "$FIXED_DEBUG_KEYSTORE" = "true" ] && [ "$signer" != "unavailable" ] && [ "$signer" != "$expected" ]; then
            echo "::warning title=Signing key differs from the fixed debug key::signer=$signer expected=$expected. The app may define its own signing config; set fixed_debug_keystore=false if that is intended."
          fi
          echo "::notice title=APK ready::commit=${COMMIT_SHA} package=$pkg analyze=$ANALYZE_STATUS tests=$TESTS_STATUS file=$(basename "$apk") size=$size apk_sha256=$apk_sha signer_sha256=$signer"
          {
            echo "### APK"
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- package (applicationId): \`$pkg\`"
            echo "- analyze: \`$ANALYZE_STATUS\` / tests: \`$TESTS_STATUS\`"
            echo "- file: \`$(basename "$apk")\` ($size)"
            echo "- APK SHA-256: \`$apk_sha\`"
            echo "- signing certificate SHA-256: \`$signer\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summarize failure
        if: ${{ failure() }}
        run: |
          {
            echo "### Build failed - last lines of each log"
            for f in "$LOG_DIR"/*.log; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$f")</summary>"
              echo
              echo '```'
              tail -n 60 "$f"
              echo '```'
              echo "</details>"
            done
            echo "Full logs: artifact \`ci-logs\` on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          # The most recently written log belongs to the failing step: expose its tail as an annotation
          # (visible in the run UI, the PR checks and the REST API, with no artifact download needed).
          last=$(find "$LOG_DIR" -name '*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -n 1 | cut -d' ' -f2- || true)
          if [ -n "$last" ]; then
            body=$(tail -n 40 "$last")
            body=${body//'%'/'%25'}
            body=${body//$'\r'/'%0D'}
            body=${body//$'\n'/'%0A'}
            echo "::error title=$(basename "$last") (last 40 lines)::$body"
          fi

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            ${{ runner.temp }}/ci-logs
            ${{ inputs.working_directory }}/build/app/reports
          if-no-files-found: ignore
          retention-days: 7
